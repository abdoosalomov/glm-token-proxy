services:
    glm-proxy:
        build: .
        container_name: glm-proxy
        restart: unless-stopped
        env_file: .env
        environment:
            - PORT=8787
            - HOST=0.0.0.0
            - NODE_EXTRA_CA_CERTS=/app/fortinet-ca.pem
        volumes:
            - ./fortinet-ca.pem:/app/fortinet-ca.pem
        ports:
            - "127.0.0.1:8787:8787"
        healthcheck:
            test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8787/"]
            interval: 30s
            timeout: 5s
            retries: 3
